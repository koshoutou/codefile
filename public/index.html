<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codefile - 登录</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card glass">
      <h1>Codefile</h1>
      <p class="subtitle">静态网页部署平台</p>
      <form id="login-form">
        <div class="input-group">
          <input type="text" id="username" placeholder="用户名" autocomplete="username" autofocus>
        </div>
        <div class="input-group">
          <input type="password" id="password" placeholder="密码" autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block">登录</button>
      </form>
      <div class="error-msg" id="error-msg"></div>
    </div>
  </div>
  <script src="/js/auth.js"></script>
</body>
</html>
